# 澈思 AI 赞助入口 · GitHub 原生 Sponsor 按钮
#
# ⚠️ 上线前必须替换下面两处占位符（`<你的用户名>` / `<你的爱发电用户名>`）：
#   1) Ko-fi 用户名    —— 注册 ko-fi.com 后，URL 形如 ko-fi.com/a/<你的用户名>
#   2) 爱发电用户名    —— 注册 afdian.com 后，URL 形如 afdian.com/a/<你的爱发电用户名>
#
# 说明：
#   ko_fi   = GitHub FUNDING.yml 的 12 个官方 key 之一 → 仓库右上角会出现原生 Sponsor 按钮
#   custom  = 人民币通道（爱发电），走自定义链接
#   两者可共存，赞助者自选币种。
#
# 许可红线：赞助与返佣必须分开披露；若日后加入返佣链接，须单独标注
# 「返佣链接可能产生佣金」，不得伪装成中立推荐。

ko_fi: "<你的 Ko-fi 用户名>"
custom: ["https://afdian.com/a/<你的爱发电用户名>"]
